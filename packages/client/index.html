<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <!-- ホーム画面に追加したとき（design §9.4）：名前・アイコン・全画面で開く。向きは固定しない -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="陣形合戦" />
    <meta name="theme-color" content="#100d08" />
    <title>陣形合戦</title>
    <meta name="description" content="部隊を並べて、動き方を決めて戦わせる陣形シミュレーション。" />
    <meta property="og:title" content="陣形合戦" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="部隊を並べて、動き方を決めて戦わせる陣形シミュレーション。" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preload" href="/fonts/DotGothic16-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('/fonts/DotGothic16-Regular.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #100d08;
        overflow: hidden;
        /* スマホで引きずったときに、ページが動いたり文字が選ばれたりしないようにする */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* ノッチとホームバーを避ける（design §9.3、§9.9-6）。余白のぶんは body の地の色が見える。
         env() を読めないブラウザでは inset: 0 が残る。border と padding は付けない（clientWidth・clientHeight を内側の大きさにするため） */
      #game {
        position: fixed;
        inset: 0;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
