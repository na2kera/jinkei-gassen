<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>陣形合戦</title>
    <link rel="preload" href="/fonts/DotGothic16-Regular.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('/fonts/DotGothic16-Regular.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #100d08;
        overflow: hidden;
        /* スマホで引きずったときに、ページが動いたり文字が選ばれたりしないようにする */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
