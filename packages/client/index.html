<html lang="ja">

    <meta property="og:title" content="陣形合戦" />

    <style>
      @font-face {
        font-family: 'DotGothic16';
        src: url('/fonts/DotGothic16-Regular.ttf') format('truetype');
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #100d08;
        overflow: hidden;
        /* スマホで引きずったときに、ページが動いたり文字が選ばれたりしないようにする */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
